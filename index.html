function inside(x,y){let m=C.map;if(m.shape=='iran'){let u=x/m.w,v=y/m.h,c=false;for(let i=0,j=IR.length-1;i<IR.length;j=i++){let a=IR[i],b=IR[j];if((a[1]>v)!=(b[1]>v)&&u<(b[0]-a[0])*(v-a[1])/(b[1]-a[1])+a[0])c=!c}return c}let p=m.p||2;return Math.abs((x-m.w/2)/(m.w/2))**p+Math.abs((y-m.h/2)/(m.h/2))**p<=1}
function ipath(){let m=C.map,e=2/(m.p||2);ctx.beginPath();if(m.shape=='iran'){IR.forEach((q,i)=>i?ctx.lineTo(q[0]*m.w,q[1]*m.h):ctx.moveTo(q[0]*m.w,q[1]*m.h));ctx.closePath();return}for(let i=0;i<=160;i++){let a=i/160*6.2832,c=Math.cos(a),s=Math.sin(a),x=m.w/2+m.w/2*Math.sign(c)*Math.abs(c)**e,y=m.h/2+m.h/2*Math.sign(s)*Math.abs(s)**e;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}

let V=[],D2=[],WET=false;const UC=['#e63946','#2a9d8f','#f4a261','#6a4c93','#1d6fd8'];
